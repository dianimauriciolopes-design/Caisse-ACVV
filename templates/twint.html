<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TWINT — Paiement</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #00b0ea;
    color: white;
    font-family: 'DM Sans', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 1.5rem;
  }
  .title { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 0.08em; opacity: 0.9; }
  .montant { font-family: 'Bebas Neue', sans-serif; font-size: 5rem; letter-spacing: 0.03em; line-height: 1; }
  .chf { font-size: 2rem; opacity: 0.7; }
  .qr-box { background: white; border-radius: 20px; padding: 1.25rem; display: inline-block; }
  .qr-box img { width: 220px; height: 220px; max-width: 90vw; display: block; }
  .instruction { font-size: 1rem; opacity: 0.85; max-width: 280px; line-height: 1.5; margin: 0 auto; }
  .instruction strong { font-weight: 700; }
  @media (max-width: 520px) {
    .title { font-size: 1.6rem; }
    .montant { font-size: 3rem; }
    .instruction { max-width: 100%; font-size: 0.95rem; }
  }
</style>
</head>
<body>
  <div class="title">📱 {{ stand }}</div>
  <div class="montant">{{ montant or '?' }} <span class="chf">CHF</span></div>
  <div class="qr-box">
    <img src="{{ url_for('static', filename='img/qrcode.jpg') }}" alt="QR TWINT">
  </div>
  <p class="instruction">
    Scanne avec <strong>TWINT</strong><br>
    et entre le montant<br>
    <strong>{{ montant or '?' }} CHF</strong>
  </p>
  <a href="/" 
   onclick="confirmerPaiementTwint()" 
   style="margin-top:20px;display:inline-block;background:white;color:#00b0ea;padding:12px 20px;border-radius:12px;font-weight:600;text-decoration:none;font-size:1.2rem;">
   ✅ Paiement reçu
</a>
<script>
  async function confirmerPaiementTwint() {
      const montant = {{ montant }};
      const standId = {{ stand }};

      const res = await fetch('/api/transaction', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
              stand_id: standId,
              montant: montant,
              mode_paiement: "twint",
              articles: []  // pas de détails ici
          })
      });

      const data = await res.json();

      if (data.success) {
          window.location.href = "/caisse/" + standId;
      } else {
          alert("Erreur lors de l’enregistrement");
      }
  }
</script>
</body>
</html>
